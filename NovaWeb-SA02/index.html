<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — NovaWeb Studio</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="login">
    <div class="login">
        <section class="login-marca">
            <h1>NovaWeb Studio</h1>
            <p>Portal corporativo para consulta de colaboradores e informações da equipe.</p>
        </section>

        <main class="login-area">
            <div class="login-cartao">
                <h2>Entrar</h2>
                <p class="subtitulo">Acesse com seu e-mail corporativo.</p>

                <form id="form-login" class="login-form" novalidate>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="nome@empresa.com" autocomplete="username" required aria-describedby="email-erro">
                        <p id="email-erro" class="mensagem-erro" aria-live="polite"></p>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required aria-describedby="senha-erro">
                        <p id="senha-erro" class="mensagem-erro" aria-live="polite"></p>
                    </div>

                    <p id="erro-geral" class="mensagem-erro" role="alert"></p>

                    <button type="submit" class="botao">Entrar</button>
                </form>

                <p class="dica">Demonstração: demo@novaweb.com / senha123</p>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

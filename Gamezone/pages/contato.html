<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone - Contato</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <!-- Cabeçalho da página de contato -->
    <header>
        <h1>Contato</h1>
        <p class="subtitulo">Envie uma mensagem para a equipe do Game Zone.</p>
    </header>

    <!-- Menu principal -->
    <nav>
        <a href="../index.html">Início</a>
        <a href="posts.html">Posts</a>
        <a class="pagina-atual" href="contato.html">Contato</a>
    </nav>

    <main>
        <!-- Informações de contato -->
        <section>
            <h2>Fale com a gente</h2>
            <p>Use o formulário abaixo para enviar sua dúvida, sugestão ou comentário.</p>
            <p>Este formulário é apenas um exemplo da atividade e não envia dados de verdade.</p>
        </section>

        <!-- Formulário básico -->
        <section id="contato">
            <h2>Formulário</h2>

            <form>
                <p class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </p>

                <p class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </p>

                <p class="campo">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem" required></textarea>
                </p>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Game Zone - 2026</p>
    </footer>
</body>
</html>
